<header class="w-full top-0 sticky z-40 bg-surface dark:bg-surface-dim flex items-center justify-between px-margin-mobile h-16 w-full">

<main class="px-margin-mobile pt-4 space-y-6 max-w-2xl mx-auto">

</div>
<div class="absolute bottom-0 right-0 bg-primary p-1.5 rounded-full border-2 border-white">

</div>
</div>
<h2 class="font-title-lg text-title-lg text-on-surface">Ananya Sharma</h2>

<!-- Safety Score Badge -->
<div class="bg-secondary-container rounded-full px-4 py-2 flex items-center gap-2">

<span class="font-label-lg text-label-lg text-on-secondary-container">Safety Score: <span class="font-bold">98/100</span></span>
</div>
</section>
<!-- Menu Sections -->
<div class="space-y-4">
<!-- Account & Security -->
<div class="space-y-2">
<h3 class="font-label-lg text-label-lg text-primary px-2 uppercase tracking-widest">Account &amp; Security</h3>
<div class="tonal-layer-1 rounded-xl overflow-hidden">
<!-- Personal Info -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors active:bg-surface-variant border-b border-outline-variant/30">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container/50 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">person</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Personal Info</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
<!-- Safety Settings -->

<div class="flex items-center gap-4">

<span class="material-symbols-outlined">logout</span>

<div class="text-center">
<p class="font-label-sm text-label-sm text-outline">Nirbhay App</p>
<p class="font-label-sm text-label-sm text-outline-variant">Version 2.4.1 (Build 1082)</p>

<span class="material-symbols-outlined">contact_phone</span>

</button>
<!-- Profile (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-5 py-1 active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
<script>
        // Subtle micro-interaction for safety score entry
        document.addEventListener('DOMContentLoaded', () => {
            const safetyBadge = document.querySelector('.bg-secondary-container');
            if (safetyBadge) {
                safetyBadge.classList.add('animate-bounce-short');
            }
        });

        // Add a small pulse effect to icons when clicked
        const menuButtons = document.querySelectorAll('.tonal-layer-1 button');
        menuButtons.forEach(btn => {
            btn.addEventListener('touchstart', () => {
                const icon = btn.querySelector('.material-symbols-outlined:first-child');
                if (icon) {
                    icon.style.transform = 'scale(1.1)';
                    icon.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
                }
            });
            btn.addEventListener('touchend', () => {
                const icon = btn.querySelector('.material-symbols-outlined:first-child');
                if (icon) {
                    icon.style.transform = 'scale(1)';
                }
            });
        });
    </script>
</body></html>
