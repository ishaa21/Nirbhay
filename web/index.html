  <style>
    #splash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background-color: #fcf8f9;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }

    .fade-in {
      animation: fadeIn 1.2s ease-out forwards;
    }

    .scale-in {
      animation: scaleIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.92); }
      to { transform: scale(1); }
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .serene-vignette {
      background: radial-gradient(circle at center, #ffffff 0%, #fcf8f9 100%);
    }
  </style>

<body>
  <!-- Splash Screen Overlay -->
  <div id="splash-overlay" class="serene-vignette">
    <main class="relative w-full h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
      <div class="fade-in scale-in flex flex-col items-center justify-center space-y-8">
        <div class="relative w-48 h-48 md:w-64 md:h-64 flex items-center justify-center">
          <img alt="Nirbhay Brand Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOeuJEWtkF2yj2r2hf8mxz16iv7Agds7psA3vSeh4y8hYXFvH2NaZfnSKCzUGsxTM0qcehk1_ykGdEpbNUnEsE6nflvlnsdsLOdIzLi4MAoXNKe9cwdzAHMBlR60CMcK7HVZxP_Fteq_QjApqDkgn-LL-bo8VmFA5N-ZfAbAOAi57ZeSxkQrRKpMG7anzp-il8qq605adNJ2kuevZ06aKTOW6obHs3kFIVOZ64EAOeD9p35HMtuQ0nw9LnUNTb2jM6VfM"/>
        </div>
        <div class="w-32 h-[1px] bg-outline-variant/30 overflow-hidden mt-12 rounded-full">
          <div class="h-full bg-primary transition-all duration-75 ease-linear" id="web-progress-bar" style="width: 0%"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
        const progressBar = document.getElementById('web-progress-bar');
        let width = 0;
        const interval = setInterval(() => {
            if (width >= 95) {
                clearInterval(interval);
            } else {
                const increment = Math.random() * 2;
                width += increment;
                if(width > 95) width = 95;
                if (progressBar) {
                  progressBar.style.width = width + '%';
                }
            }
        }, 30);
    });
  </script>
